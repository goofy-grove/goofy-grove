openapi: '3.1.0'
info:
  title: Goofy Grove Server API
  version: '0.1.0'
servers:
  - url: http://127.0.0.2:3003/api/v1
security:
  - JwtToken: []
tags:
  - name: Authentication
  - name: Users
  - name: Personas
  - name: Characters
  - name: Chats
  - name: Messages
  - name: Files
paths:
  /personas:
    get:
      tags: [Personas]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonasResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Personas]
      parameters:
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaCreateRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCreateResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /personas/{uid}:
    patch:
      tags: [Personas]
      parameters:
        - name: uid
          in: path
          required: true
          description: Persona Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaUpdateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCreateResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Personas]
      parameters:
        - name: uid
          in: path
          required: true
          description: Persona Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaDeleteResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /personas/{uid}/avatar:
    put:
      tags: [Personas]
      summary: Upload persona avatar
      parameters:
        - name: uid
          in: path
          required: true
          description: Persona Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Avatar image file
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Personas]
      summary: Remove persona avatar
      parameters:
        - $ref: '#/components/parameters/PersonaUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /files/{uid}:
    get:
      tags: [Files]
      summary: Download file by uid
      parameters:
        - name: uid
          in: path
          required: true
          description: File Unique ID
          schema:
            type: string
      responses:
        200:
          description: File content
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /chats:
    get:
      tags: [Chats]
      summary: List chats available to the current user
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatsResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Chats]
      summary: Create a chat
      parameters:
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'

  /chats/{chat_uid}:
    patch:
      tags: [Chats]
      summary: Rename a chat
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatUpdateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInfoResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Chats]
      summary: Delete a chat
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /chats/{chat_uid}/avatar:
    put:
      tags: [Chats]
      summary: Set chat avatar
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInfoResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Chats]
      summary: Remove chat avatar
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInfoResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /chats/{chat_uid}/members:
    post:
      tags: [Chats]
      summary: Add a member to a chat
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMemberAddRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMemberResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        409:
          $ref: '#/components/responses/ConflictError'
        default:
          $ref: '#/components/responses/InternalError'

  /chats/{chat_uid}/members/{user_uid}:
    delete:
      tags: [Chats]
      summary: Remove a member from a chat
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - $ref: '#/components/parameters/UserUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMemberResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /chats/{chat_uid}/characters:
    post:
      tags: [Chats]
      summary: Add a character to a chat
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCharacterAddRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCharacterResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        409:
          $ref: '#/components/responses/ConflictError'
        default:
          $ref: '#/components/responses/InternalError'

  /chats/{chat_uid}/characters/{character_uid}:
    delete:
      tags: [Chats]
      summary: Remove a character from a chat
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - $ref: '#/components/parameters/ChatCharacterUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCharacterResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /chats/{chat_uid}/messages:
    get:
      tags: [Messages]
      summary: Get messages by cursor
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            format: uint64
            minimum: 1
        - name: page
          in: query
          required: false
          description: URL-safe Base64 cursor returned as `next_page`.
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessagesResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Messages]
      summary: Send a message
      parameters:
        - $ref: '#/components/parameters/ChatUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'
  /characters:
    get:
      tags: [Characters]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharactersResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Characters]
      parameters:
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterCreateRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCreateResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /characters/{uid}:
    patch:
      tags: [Characters]
      parameters:
        - name: uid
          in: path
          required: true
          description: Character Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterUpdateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCreateResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Characters]
      parameters:
        - name: uid
          in: path
          required: true
          description: Character Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDeleteResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /characters/{uid}/avatar:
    put:
      tags: [Characters]
      summary: Upload character avatar
      description: |
        Returns 403 `file_access_denied` when the character does not exist or the caller
        is not the owner. The file access layer intentionally does not distinguish these
        cases.
      parameters:
        - name: uid
          in: path
          required: true
          description: Character Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Avatar image file
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Characters]
      summary: Remove character avatar
      parameters:
        - $ref: '#/components/parameters/CharacterUid'
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      tags: [Users]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'

  /users/me/avatar:
    put:
      tags: [Users]
      summary: Upload user avatar
      parameters:
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Avatar image file
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Users]
      summary: Remove current user avatar
      parameters:
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              description: |
                HttpOnly refresh token cookie. Attributes: Secure, SameSite=None,
                Path=/api/v1/auth/refresh.
              schema:
                type: string
              example: refresh_token=eyJ...; Secure; HttpOnly; SameSite=None; Path=/api/v1/auth/refresh; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Authentication]
      security: []
      summary: Refresh tokens
      description: |
        Exchanges the `refresh_token` HttpOnly cookie for a new access token and
        rotates the refresh cookie. No request body is required.
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          description: Refresh token issued by `/auth/login`
          schema:
            type: string
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              description: |
                Rotated refresh token cookie. Attributes: Secure, SameSite=None,
                Path=/api/v1/auth/refresh.
              schema:
                type: string
              example: refresh_token=eyJ...; Secure; HttpOnly; SameSite=None; Path=/api/v1/auth/refresh; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Authentication]
      security: []
      summary: Logout
      description: Invalidates the refresh token when present and clears its cookie.
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              description: Clears the `refresh_token` HttpOnly cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
        default:
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    JwtToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token in Bearer format

  parameters:
    SocketIdHeader:
      name: x-socket-id
      in: header
      required: false
      description: |
        Optional Socket.IO socket id. When provided, that participant is excluded
        from the broadcast of the mutation event.
      schema:
        type: string
    PersonaUid:
      name: uid
      in: path
      required: true
      description: Persona unique ID
      schema:
        type: string
    CharacterUid:
      name: uid
      in: path
      required: true
      description: Character unique ID
      schema:
        type: string
    ChatUid:
      name: chat_uid
      in: path
      required: true
      description: Chat unique ID
      schema:
        type: string
    UserUid:
      name: user_uid
      in: path
      required: true
      description: User unique ID
      schema:
        type: string
    ChatCharacterUid:
      name: character_uid
      in: path
      required: true
      description: Character unique ID
      schema:
        type: string

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: auth_invalid_credentials

    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: persona_create_failed

    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: persona_invalid_name

    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: persona_not_found

    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: file_access_denied

    ConflictError:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: chat_user_already_in_chat

  schemas:
    # Requests
    PersonaCreateRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          description: Persona Name
        description:
          type: string
          description: Persona Description
    PersonaUpdateRequest:
      type: object
      description: At least one of `name` or `description` must be provided
      minProperties: 1
      properties:
        name:
          type: string
          description: Persona Name
        description:
          type: string
          description: Persona Description
    CharacterCreateRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          description: Character Name
        description:
          type: string
          description: Character Description
    CharacterUpdateRequest:
      type: object
      description: At least one of `name` or `description` must be provided
      minProperties: 1
      properties:
        name:
          type: string
          description: Character Name
        description:
          type: string
          description: Character Description
    AuthenticationRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AvatarUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Avatar image file
    ChatCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ChatUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    ChatMemberAddRequest:
      type: object
      required: [user_uid]
      properties:
        user_uid:
          type: string
    ChatCharacterAddRequest:
      type: object
      required: [character_uid]
      properties:
        character_uid:
          type: string
    SendMessageRequest:
      type: object
      required: [content, author]
      properties:
        content:
          type: string
        author:
          $ref: '#/components/schemas/MessageAuthorUid'
        reply_to_message_uid:
          type: [string, 'null']

    # Responses
    ErrorResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: true
        data:
          type: object
          required: [code]
          properties:
            code:
              type: string
              description: Stable snake_case error code for client-side localization
              example: persona_invalid_name
            params:
              type: object
              description: Optional interpolation parameters for localized messages
              additionalProperties: true
              example:
                max_size: 1048576
                size: 2097152
    AuthenticationResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          properties:
            token:
              type: string
              description: Access Token
            exp:
              type: integer
              description: Date when token will expire (unix timestamp)
    UserResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/User'
    EmptyResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          type: object
          additionalProperties: false
    ChatResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/Chat'
    ChatsResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          type: array
          items:
            $ref: '#/components/schemas/Chat'
    ChatInfoResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/ChatInfo'
    ChatMemberResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/ChatMember'
    ChatCharacterResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/ChatCharacter'
    MessageResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/Message'
    PaginatedMessagesResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/PaginatedMessages'
    PersonasResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: array
          items:
            $ref: '#/components/schemas/Persona'
    PersonaCreateResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/Persona'
    PersonaResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/Persona'
    PersonaDeleteResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: object
    CharactersResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: array
          items:
            $ref: '#/components/schemas/Character'
    CharacterCreateResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/Character'
    CharacterResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/Character'
    CharacterDeleteResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: object

    # Data
    Persona:
      type: object
      required: [uid, name, description, creator_uid]
      properties:
        uid:
          type: string
          description: Persona Unique ID
        name:
          type: string
          description: Persona Name
        description:
          type: string
          description: Persona Description
        creator_uid:
          type: string
          description: Creator Unique ID (User UID)
        avatar_uid:
          oneOf:
            - type: string
            - type: 'null'
          description: Current avatar file uid
    Character:
      type: object
      required: [uid, name, description, creator_uid]
      properties:
        uid:
          type: string
          description: Character Unique ID
        name:
          type: string
          description: Character Name
        description:
          type: string
          description: Character Description
        creator_uid:
          type: string
          description: Creator Unique ID (User UID)
        avatar_uid:
          oneOf:
            - type: string
            - type: 'null'
          description: Current avatar file uid
    User:
      type: object
      required: [uid, username]
      properties:
        uid:
          type: string
          description: User Unique ID
        username:
          type: string
          description: Nickname, login, username
        avatar_uid:
          oneOf:
            - type: string
            - type: 'null'
          description: Current avatar file uid
    ChatInfo:
      type: object
      required: [uid, name, created_at, creator_uid]
      properties:
        uid:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        creator_uid:
          type: string
        avatar_uid:
          type: [string, 'null']
    ChatMember:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [joined_at, chat_uid]
          properties:
            joined_at:
              type: string
              format: date-time
            chat_uid:
              type: string
    ChatCharacter:
      allOf:
        - $ref: '#/components/schemas/Character'
        - type: object
          required: [connected_at, chat_uid]
          properties:
            connected_at:
              type: string
              format: date-time
            chat_uid:
              type: string
    Chat:
      allOf:
        - $ref: '#/components/schemas/ChatInfo'
        - type: object
          required: [members, characters]
          properties:
            members:
              type: array
              items:
                $ref: '#/components/schemas/ChatMember'
            characters:
              type: array
              items:
                $ref: '#/components/schemas/ChatCharacter'
    MessageAuthorUid:
      oneOf:
        - type: object
          required: [kind, uid]
          properties:
            kind:
              type: string
              const: persona
            uid:
              type: string
        - type: object
          required: [kind, uid]
          properties:
            kind:
              type: string
              const: character
            uid:
              type: string
    MessageAuthor:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/Persona'
            - type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  const: persona
        - allOf:
            - $ref: '#/components/schemas/Character'
            - type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  const: character
    MessageInfo:
      type: object
      required: [uid, content, created_at, chat_uid, is_removed]
      properties:
        uid:
          type: string
        author_uid:
          oneOf:
            - $ref: '#/components/schemas/MessageAuthorUid'
            - type: 'null'
        content:
          type: string
        created_at:
          type: string
          format: date-time
        chat_uid:
          type: string
        reply_to_message_uid:
          type: [string, 'null']
        is_removed:
          type: boolean
    Message:
      type: object
      required: [uid, content, created_at, chat_uid, is_removed]
      properties:
        uid:
          type: string
        author:
          oneOf:
            - $ref: '#/components/schemas/MessageAuthor'
            - type: 'null'
        content:
          type: string
        created_at:
          type: string
          format: date-time
        chat_uid:
          type: string
        reply_to_message:
          oneOf:
            - $ref: '#/components/schemas/MessageInfo'
            - type: 'null'
        is_removed:
          type: boolean
    PaginatedMessages:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_page:
          type: [string, 'null']
