openapi: '3.1.0'
info:
  title: Goofy Grove Server API
  version: '0.1.0'
servers:
  - url: http://127.0.0.2:3003/api/v1
security:
  - JwtToken: []
tags:
  - name: Authentication
  - name: Users
  - name: Personas
  - name: Characters
  - name: Files
paths:
  /personas:
    get:
      tags: [Personas]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonasResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Personas]
      parameters:
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaCreateRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCreateResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /personas/{uid}:
    patch:
      tags: [Personas]
      parameters:
        - name: uid
          in: path
          required: true
          description: Persona Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaUpdateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCreateResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Personas]
      parameters:
        - name: uid
          in: path
          required: true
          description: Persona Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaDeleteResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /personas/{uid}/avatar:
    post:
      tags: [Personas]
      summary: Upload persona avatar
      parameters:
        - name: uid
          in: path
          required: true
          description: Persona Unique ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Avatar image file
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        default:
          $ref: '#/components/responses/InternalError'

  /files/{uid}:
    get:
      tags: [Files]
      summary: Download file by uid
      parameters:
        - name: uid
          in: path
          required: true
          description: File Unique ID
          schema:
            type: string
      responses:
        200:
          description: File content
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /characters:
    get:
      tags: [Characters]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharactersResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Characters]
      parameters:
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterCreateRequest'
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCreateResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /characters/{uid}:
    patch:
      tags: [Characters]
      parameters:
        - name: uid
          in: path
          required: true
          description: Character Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharacterUpdateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCreateResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Characters]
      parameters:
        - name: uid
          in: path
          required: true
          description: Character Unique ID
          schema:
            type: string
        - $ref: '#/components/parameters/SocketIdHeader'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterDeleteResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /characters/{uid}/avatar:
    post:
      tags: [Characters]
      summary: Upload character avatar
      description: |
        Returns 403 `file_access_denied` when the character does not exist or the caller
        is not the owner. The file access layer intentionally does not distinguish these
        cases.
      parameters:
        - name: uid
          in: path
          required: true
          description: Character Unique ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Avatar image file
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        default:
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      tags: [Users]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      tags: [Users]
      summary: Update current user
      parameters:
        - $ref: '#/components/parameters/SocketIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /users/me/avatar:
    post:
      tags: [Users]
      summary: Upload user avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Avatar image file
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        403:
          $ref: '#/components/responses/ForbiddenError'
        default:
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              description: |
                HttpOnly refresh token cookie. Attributes: Secure, SameSite=None,
                Path=/api/v1/auth/refresh.
              schema:
                type: string
              example: refresh_token=eyJ...; Secure; HttpOnly; SameSite=None; Path=/api/v1/auth/refresh; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Authentication]
      security: []
      summary: Refresh tokens
      description: |
        Exchanges the `refresh_token` HttpOnly cookie for a new access token and
        rotates the refresh cookie. No request body is required.
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          description: Refresh token issued by `/auth/login`
          schema:
            type: string
      responses:
        200:
          description: OK
          headers:
            Set-Cookie:
              description: |
                Rotated refresh token cookie. Attributes: Secure, SameSite=None,
                Path=/api/v1/auth/refresh.
              schema:
                type: string
              example: refresh_token=eyJ...; Secure; HttpOnly; SameSite=None; Path=/api/v1/auth/refresh; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    JwtToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token in Bearer format

  parameters:
    SocketIdHeader:
      name: x-socket-id
      in: header
      required: false
      description: |
        Optional Socket.IO socket id. When provided, that participant is excluded
        from the broadcast of the mutation event.
      schema:
        type: string

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: auth_invalid_credentials

    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: persona_create_failed

    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: persona_invalid_name

    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: persona_not_found

    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: true
            data:
              code: file_access_denied

  schemas:
    # Requests
    PersonaCreateRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          description: Persona Name
        description:
          type: string
          description: Persona Description
        avatar_uid:
          type: string
          description: Optional file uid to bind as avatar on create
    PersonaUpdateRequest:
      type: object
      description: At least one of `name`, `description`, or `avatar_uid` must be provided
      minProperties: 1
      properties:
        name:
          type: string
          description: Persona Name
        description:
          type: string
          description: Persona Description
        avatar_uid:
          oneOf:
            - type: string
            - type: 'null'
          description: File uid to bind as avatar, or null to clear
    UserUpdateRequest:
      type: object
      required: [avatar_uid]
      properties:
        avatar_uid:
          oneOf:
            - type: string
            - type: 'null'
          description: File uid to bind as avatar, or null to clear
    FileUploadResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: object
          required: [uid]
          properties:
            uid:
              type: string
              description: Uploaded file uid (status Created until bound via PATCH)
    CharacterCreateRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          description: Character Name
        description:
          type: string
          description: Character Description
        avatar_uid:
          type: string
          description: Optional file uid to bind as avatar on create
    CharacterUpdateRequest:
      type: object
      description: At least one of `name`, `description`, or `avatar_uid` must be provided
      minProperties: 1
      properties:
        name:
          type: string
          description: Character Name
        description:
          type: string
          description: Character Description
        avatar_uid:
          oneOf:
            - type: string
            - type: 'null'
          description: File uid to bind as avatar, or null to clear
    AuthenticationRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    # Responses
    ErrorResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: true
        data:
          type: object
          required: [code]
          properties:
            code:
              type: string
              description: Stable snake_case error code for client-side localization
              example: persona_invalid_name
            params:
              type: object
              description: Optional interpolation parameters for localized messages
              additionalProperties: true
              example:
                max_size: 1048576
                size: 2097152
    AuthenticationResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          properties:
            token:
              type: string
              description: Access Token
            exp:
              type: integer
              description: Date when token will expire (unix timestamp)
    UserResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/User'
    PersonasResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: array
          items:
            $ref: '#/components/schemas/Persona'
    PersonaCreateResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/Persona'
    PersonaDeleteResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: object
    CharactersResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: array
          items:
            $ref: '#/components/schemas/Character'
    CharacterCreateResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/Character'
    CharacterDeleteResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: object

    # Data
    Persona:
      type: object
      required: [uid, name, description, creator_uid]
      properties:
        uid:
          type: string
          description: Persona Unique ID
        name:
          type: string
          description: Persona Name
        description:
          type: string
          description: Persona Description
        creator_uid:
          type: string
          description: Creator Unique ID (User UID)
        avatar_uid:
          oneOf:
            - type: string
            - type: 'null'
          description: Current avatar file uid
    Character:
      type: object
      required: [uid, name, description, creator_uid]
      properties:
        uid:
          type: string
          description: Character Unique ID
        name:
          type: string
          description: Character Name
        description:
          type: string
          description: Character Description
        creator_uid:
          type: string
          description: Creator Unique ID (User UID)
        avatar_uid:
          oneOf:
            - type: string
            - type: 'null'
          description: Current avatar file uid
    User:
      type: object
      required: [uid, username]
      properties:
        uid:
          type: string
          description: User Unique ID
        username:
          type: string
          description: Nickname, login, username
        avatar_uid:
          oneOf:
            - type: string
            - type: 'null'
          description: Current avatar file uid
