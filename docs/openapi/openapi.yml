openapi: '3.1.0'
info:
  title: Goofy Grove Server API
  version: '0.1.0'
servers:
  - url: https://127.0.0.2:3003/api/v1
security:
  - JwtToken: []
tags:
  - name: Authentication
  - name: Users
  - name: Personas
paths:
  /personas:
    get:
      tags: [Personas]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonasResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Personas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaCreateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCreateResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        default:
          $ref: '#/components/responses/InternalError'

  /personas/{uid}:
    patch:
      tags: [Personas]
      parameters:
        - name: uid
          in: path
          required: true
          description: Persona Unique ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaUpdateRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCreateResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Personas]
      parameters:
        - name: uid
          in: path
          required: true
          description: Persona Unique ID
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaDeleteResponse'
        400:
          $ref: '#/components/responses/BadRequestError'
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          $ref: '#/components/responses/NotFoundError'
        default:
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      tags: [Users]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        401:
          $ref: '#/components/responses/UnauthorizedError'
  
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResponse'

        401:
          $ref: '#/components/responses/UnauthorizedError'
        
        default:
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Authentication]
      security: []
      summary: Refresh tokens
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationResponse'

        401:
          $ref: '#/components/responses/UnauthorizedError'
        
        default:
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
      JwtToken:
        type: http
        scheme: bearer
        bearerFormat: JWT
        description: JWT token in Bearer format

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  data:
                    properties:
                      code:
                        const: unauthorized

    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  data:
                    properties:
                      code:
                        const: internal_error

    BadRequestError:
      description: Bad Request
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  data:
                    properties:
                      code:
                        const: bad_request

    NotFoundError:
      description: Not Found
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  data:
                    properties:
                      code:
                        const: not_found


  schemas:
    # Requests
    PersonaCreateRequest:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          description: Persona Name
        description:
          type: string
          description: Persona Description
    PersonaUpdateRequest:
      type: object
      description: At least one of `name` or `description` must be provided
      minProperties: 1
      properties:
        name:
          type: string
          description: Persona Name
        description:
          type: string
          description: Persona Description
    AuthorizationRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    # Enums
    ErrorCodes:
      type: string
      enum:
        - unauthorized
        - internal_error
        - bad_request
        - not_found

    # Responses
    ErrorResponse:
      type: object
      required: [error, data]
      properties:
        error:
          type: boolean
          const: true
        data:
          type: object
          required: [reasons, code]
          properties:
            reasons:
              type: array
              items:
                type: string
              example: ['Failed to authenticate user']
            code:
              $ref: '#/components/schemas/ErrorCodes'
    AuthorizationResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          properties:
            token:
              type: string
              description: Access Token
            exp:
              type: integer
              description: Date when token will expire (unix timestamp)
    UserResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/User'
    PersonasResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: array
          items:
            $ref: '#/components/schemas/Persona'
    PersonaCreateResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          $ref: '#/components/schemas/Persona'
    PersonaDeleteResponse:
      type: object
      properties:
        error:
          type: boolean
          const: false
        data:
          type: object

    # Data
    Persona:
      type: object
      required: [uid, name, description, creator_uid]
      properties:
        uid:
          type: string
          description: Persona Unique ID
        name:
          type: string
          description: Persona Name
        description:
          type: string
          description: Persona Description
        creator_uid:
          type: string
          description: Creator Unique ID (User UID)
    User:
      type: object
      required: [uid, username]
      properties:
        uid:
          type: string
          description: User Unique ID
        username:
          type: string
          description: Nickname, login, username
      